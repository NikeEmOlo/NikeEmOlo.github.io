<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none" class="doodle-icon doodle-linkedin-icon">
  <!-- Grounding Hard-Edge Drop Shadow -->
  <rect x="5.5" y="7.5" width="25" height="25" rx="7" fill="#000000" transform="translate(1.5, 2)"/>

  <!-- Kinetic Doodle Lightning Spark (Top-Right) -->
  <path d="M28 3L26 7H29L27 11" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 3L26 7H29L27 11" stroke="#FFDA00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Badge Body (Electric Doodle Cyan) -->
  <rect x="5.5" y="6.5" width="25" height="25" rx="6.5" fill="#00B3E3" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Stepped Cel-Shade Plane (Bottom Half) -->
  <path d="M5.8 21C6.5 27 9.5 31.2 16 31.2H25.5C28.8 31.2 30.2 28.5 30.2 25V21H5.8Z" fill="#008EB5"/>

  <!-- Tactile Vinyl Specular Gloss Glint -->
  <path d="M8.5 10C8.5 8.5 10 7.5 12 7.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="8" cy="13" r="0.7" fill="#FFFFFF"/>

  <!-- Chunky Doodle Graffiti "i" -->
  <!-- "i" dot (playful star/tilted circle) -->
  <circle cx="11.5" cy="12.5" r="2.2" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <circle cx="11.2" cy="12" r="0.7" fill="#FFDA00"/>
  <!-- "i" stem -->
  <rect x="9.5" y="16.5" width="4" height="10" rx="1.5" fill="#FFFFFF" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- Chunky Doodle Graffiti "n" -->
  <!-- "n" left stem -->
  <rect x="16" y="16.5" width="3.8" height="10" rx="1.4" fill="#FFFFFF" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- "n" arch and right stem -->
  <path d="M18.5 20.5C18.5 17.5 20.5 16.5 23 16.5C25.5 16.5 27 18 27 21V26.5H23.2V21.5C23.2 20.2 22.5 19.5 21.5 19.5C20.5 19.5 19.8 20.2 19.8 21.5V26.5H16" fill="#FFFFFF" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- "n" arch inner cel-accent -->
  <circle cx="23.5" cy="22" r="0.8" fill="#00B3E3"/>
</svg>
