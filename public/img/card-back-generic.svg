<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 921" width="600" height="921">
  <defs>
    <radialGradient id="back-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="60%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#080a10" />
    </radialGradient>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#252b3d" fill-opacity="0.4" />
    </pattern>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a324b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#181e2e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2a324b" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Base Obsidian Background -->
  <rect width="600" height="921" rx="28" fill="url(#back-glow)" />

  <!-- Subtle Dot Grid Background -->
  <rect x="24" y="24" width="552" height="873" rx="20" fill="url(#dot-grid)" />

  <!-- Outer Double Inset Border -->
  <rect x="20" y="20" width="560" height="881" rx="20" fill="none" stroke="url(#border-grad)" stroke-width="2" />
  <rect x="28" y="28" width="544" height="865" rx="16" fill="none" stroke="#1f2536" stroke-width="1" stroke-opacity="0.6" />

  <!-- Inner Concentric Frame -->
  <rect x="44" y="44" width="512" height="833" rx="12" fill="none" stroke="#252c3d" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Corner Accents -->
  <path d="M 44 64 L 44 44 L 64 44" fill="none" stroke="#4c566a" stroke-width="2" />
  <path d="M 556 64 L 556 44 L 536 44" fill="none" stroke="#4c566a" stroke-width="2" />
  <path d="M 44 857 L 44 877 L 64 877" fill="none" stroke="#4c566a" stroke-width="2" />
  <path d="M 556 857 L 556 877 L 536 877" fill="none" stroke="#4c566a" stroke-width="2" />

  <!-- Center Minimal Crest Geometry -->
  <g transform="translate(300, 460.5)">
    <circle r="90" fill="none" stroke="#1b202e" stroke-width="1" />
    <circle r="80" fill="#0d1017" stroke="#2a3246" stroke-width="1.5" />
    <circle r="72" fill="none" stroke="#1f2637" stroke-width="1" stroke-dasharray="3 4" />

    <polygon points="0,-42 42,0 0,42 -42,0" fill="#141824" stroke="#3b455f" stroke-width="1.5" />
    <polygon points="0,-24 24,0 0,24 -24,0" fill="none" stroke="#5a688a" stroke-width="1" />

    <circle r="5" fill="#6c7d9e" />
  </g>
</svg>
